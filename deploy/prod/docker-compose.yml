networks:
  ysc-net:
    name: ysc-net
    external: true

services:
  nginx:
    image: nginx:1.19.2-alpine
    container_name: reverse-proxy-server
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt/live/ystemandchess.com/fullchain.pem:/etc/ysc-certs/ysc-cert.pem
      - /etc/letsencrypt/live/ystemandchess.com/privkey.pem:/etc/ysc-certs/ysc-key.pem
      - /etc/letsencrypt/options-ssl-nginx.conf:/etc/ysc-certs/options-ssl-nginx.conf
      - /etc/letsencrypt/ssl-dhparams.pem:/etc/ysc-certs/ysc-dhparam.pem
      - /etc/letsencrypt/live/ystemandchess.com/chain.pem:/etc/ysc-certs/ysc-chain.pem
    networks:
      - ysc-net
    ports:
      - 80:80
      - 443:443
    depends_on:
      - chessserver
      - middleware
      - stockfishserver
      - ystemandchess

  chessserver:
    image: chessserver:${TAG:-latest}
    container_name: chessserver
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MIDDLEWARE_URL=${MIDDLEWARE_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
    networks:
      - ysc-net
    expose:
      - "3001"

  stockfishserver:
    image: stockfishserver:${TAG:-latest}
    container_name: stockfishserver
    environment:
      - NODE_ENV=production
      - PORT=8080
      - CORS_ORIGIN=${CORS_ORIGIN}
    networks:
      - ysc-net
    expose:
      - "8080"

  middleware:
    image: middlewarenode
    container_name: middleware
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGO_URI=${MONGO_URI}
      - INDEX_KEY=${INDEX_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - AZURE_STORAGE_ACCOUNT=${AZURE_STORAGE_ACCOUNT}
      - AZURE_STORAGE_KEY=${AZURE_STORAGE_KEY}
      - AZURE_STORAGE_CONTAINER=${AZURE_STORAGE_CONTAINER}
      - AZURE_STORAGE_REGION=${AZURE_STORAGE_REGION}
      - AGORA_APP_ID=${AGORA_APP_ID}
      - AGORA_UID=${AGORA_UID}
      - AGORA_CUSTOMER_ID=${AGORA_CUSTOMER_ID}
      - AGORA_CUSTOMER_CERT=${AGORA_CUSTOMER_CERT}
      - BASEPATH=${BASEPATH}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - EMAIL_USER=${EMAIL_USER}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SESSION_SECRET=${SESSION_SECRET}
      - ANALYTICS_RATE_LIMIT_MAX=${ANALYTICS_RATE_LIMIT_MAX:-100}
      - LEADERBOARD_RATE_LIMIT_MAX=${LEADERBOARD_RATE_LIMIT_MAX:-60}
    networks:
      - ysc-net
    expose:
      - '8000'

  ystemandchess:
    image: ystemandchess:${TAG:-latest}
    container_name: ystemandchess
    networks:
      - ysc-net
    expose:
      - "3000"
    depends_on:
      - middleware
      - stockfishserver
      - chessserver
