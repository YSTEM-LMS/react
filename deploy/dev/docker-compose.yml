services:
  apache:
    image: httpd:2.4
    ports:
      - "80:80"
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - react-app
      - middlewarenode
      - chessserver
      - stockfishserver
      - chessclient

  react-app:
    build:
      context: ../../react-ystemandchess
      args:
        REACT_APP_AGORA_APP_ID: ""
    container_name: react-app
    # The image's nginx proxies the services under path prefixes. Open
    # http://localhost:3000 for sockets; the apache "/" route below does not
    # proxy websockets.
    environment:
      MIDDLEWARE_UPSTREAM: http://middlewarenode:8000
      CHESS_SERVER_UPSTREAM: http://chessserver:3001
      STOCKFISH_UPSTREAM: http://stockfishserver:9324
      CHESS_CLIENT_UPSTREAM: http://chessclient:80
    ports:
      - "3000:8080"
    depends_on:
      - middlewarenode
      - chessserver
      - stockfishserver
      - chessclient

  middlewarenode:
    build: ../../middlewareNode
    container_name: middlewarenode
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - INDEX_KEY=dev-index-key-replace-in-prod
      - CORS_ORIGIN=http://localhost,http://localhost:3000
      - SESSION_SECRET=dev-secret-replace-in-prod
      - ANALYTICS_RATE_LIMIT_MAX=100
      - LEADERBOARD_RATE_LIMIT_MAX=60

  chessserver:
    build: ../../chessServer
    container_name: chessserver
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MIDDLEWARE_URL=http://middlewarenode:8000
      - CORS_ORIGIN=http://localhost,http://localhost:3000,http://localhost:3002

  stockfishserver:
    build: ../../stockfishServer
    container_name: stockfishserver
    ports:
      - "9324:9324"
    environment:
      - NODE_ENV=development
      - PORT=9324
      - CORS_ORIGIN=http://localhost,http://localhost:3000

  chessclient:
    build: ../../chessclient
    container_name: chessclient

# Usage: docker-compose up --build
# Access at: http://localhost
