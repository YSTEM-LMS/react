services:
  apache:
    image: httpd:2.4
    ports:
      - "80:80"
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - react-app
      - middlewarenode
      - chessserver
      - stockfishserver

  react-app:
    build:
      context: ../../react-ystemandchess
      args:
        REACT_APP_CHESS_SERVER_URL: http://localhost:3001
        REACT_APP_MIDDLEWARE_URL: http://localhost:8000
        REACT_APP_STOCKFISH_SERVER_URL: http://localhost:9324
        REACT_APP_AGORA_APP_ID: ""
    container_name: react-app
    ports:
      - "3000:3000"

  middlewarenode:
    build: ../../middlewareNode
    container_name: middlewarenode
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - INDEX_KEY=dev-index-key-replace-in-prod
      - CORS_ORIGIN=http://localhost,http://localhost:3000
      - SESSION_SECRET=dev-secret-replace-in-prod
      - ANALYTICS_RATE_LIMIT_MAX=100
      - LEADERBOARD_RATE_LIMIT_MAX=60

  chessserver:
    build: ../../chessServer
    container_name: chessserver
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MIDDLEWARE_URL=http://middlewarenode:8000
      - CORS_ORIGIN=http://localhost,http://localhost:3000,http://localhost:3002

  stockfishserver:
    build: ../../stockfishServer
    container_name: stockfishserver
    ports:
      - "9324:9324"
    environment:
      - NODE_ENV=development
      - PORT=9324
      - CORS_ORIGIN=http://localhost,http://localhost:3000

# Usage: docker-compose up --build
# Access at: http://localhost
