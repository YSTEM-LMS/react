name: Deploy to Azure

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ystem-prod-rg
  IMAGE_PREFIX: ghcr.io/ystem-lms
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push middleware
        uses: docker/build-push-action@v6
        with:
          context: ./middlewareNode
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/middlewarenode:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE_PREFIX }}/middlewarenode:latest

      - name: Build and push chess server
        uses: docker/build-push-action@v6
        with:
          context: ./chessServer
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/chessserver:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE_PREFIX }}/chessserver:latest

      - name: Build and push Stockfish
        uses: docker/build-push-action@v6
        with:
          context: ./stockfishServer
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/stockfishserver:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE_PREFIX }}/stockfishserver:latest

      - name: Build and push chess client
        uses: docker/build-push-action@v6
        with:
          context: ./chessclient
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/chessclient:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE_PREFIX }}/chessclient:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./react-ystemandchess
          platforms: linux/amd64
          push: true
          build-args: |
            REACT_APP_MIDDLEWARE_URL=${{ secrets.MIDDLEWARE_URL }}
            REACT_APP_STOCKFISH_SERVER_URL=${{ secrets.STOCKFISH_URL }}
            REACT_APP_CHESS_SERVER_URL=${{ secrets.CHESS_SERVER }}
            REACT_APP_CHESS_CLIENT_URL=${{ secrets.CHESS_CLIENT_URL }}
            REACT_APP_AGORA_APP_ID=${{ secrets.APP_ID }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/ystemandchess:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE_PREFIX }}/ystemandchess:latest

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy middleware
        run: |
          az containerapp update \
            --name ystem-middleware \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE_PREFIX}/middlewarenode:${DEPLOY_SHA}"

      - name: Deploy chess server
        run: |
          az containerapp update \
            --name ystem-chessserver \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE_PREFIX}/chessserver:${DEPLOY_SHA}"

      - name: Deploy Stockfish
        run: |
          az containerapp update \
            --name ystem-stockfish \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE_PREFIX}/stockfishserver:${DEPLOY_SHA}"

      - name: Deploy chess client
        run: |
          az containerapp update \
            --name ystem-chessclient \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE_PREFIX}/chessclient:${DEPLOY_SHA}"

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name ystem-frontend \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE_PREFIX}/ystemandchess:${DEPLOY_SHA}"

      - name: Smoke test frontend
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            https://ystem-frontend.proudglacier-1911e147.westus2.azurecontainerapps.io/

      - name: Smoke test middleware
        run: |
          curl --fail --retry 5 --retry-delay 10 \
            https://ystem-middleware.proudglacier-1911e147.westus2.azurecontainerapps.io/
