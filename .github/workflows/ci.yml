name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets this workflow be run manually against any branch (Actions tab ->
  # "Run workflow", or `gh workflow run`), without needing to push/PR to
  # main first. Doesn't change push/pull_request behavior at all.
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MONGOMS_VERSION: 8.2.6

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: 'npm'

      # middlewareNode
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-${{ env.MONGOMS_VERSION }}

      - name: Install dependencies (middlewareNode)
        run: npm ci
        working-directory: ./middlewareNode

      - name: Build middlewareNode
        run: npm run build --if-present
        working-directory: ./middlewareNode

      - name: Test middlewareNode
        run: npm test -- --testTimeout=30000
        working-directory: ./middlewareNode

      # chessServer
      - name: Install dependencies (chessServer)
        run: npm ci
        working-directory: ./chessServer

      - name: Build chessServer
        run: npm run build --if-present
        working-directory: ./chessServer

      - name: Test chessServer
        run: npm test
        working-directory: ./chessServer

      # stockfishServer
      - name: Install dependencies (stockfishServer)
        run: npm ci
        working-directory: ./stockfishServer

      - name: Build stockfishServer
        run: npm run build --if-present
        working-directory: ./stockfishServer

      - name: Test stockfishServer
        run: npm test
        working-directory: ./stockfishServer

      # react frontend
      - name: Install dependencies (react frontend)
        run: npm ci
        working-directory: ./react-ystemandchess

      - name: Build react-ystemandchess
        run: CI=false npm run build --if-present
        working-directory: ./react-ystemandchess
        env:
          # These are read by src/environments/environment.prod.js, which is
          # what the app actually imports (via src/environments/index.js).
          # The previous "Create environment file" step wrote to
          # src/core/environments/environment.ts, a path nothing in the app
          # imports, so these secrets never reached the built app.
          REACT_APP_MIDDLEWARE_URL: ${{ secrets.MIDDLEWARE_URL || 'https://ystemandchess.com/middleware' }}
          REACT_APP_STOCKFISH_SERVER_URL: ${{ secrets.STOCKFISH_URL || 'https://ystemandchess.com/stockfishserver' }}
          REACT_APP_CHESS_SERVER_URL: ${{ secrets.CHESS_SERVER || 'https://ystemandchess.com/chessserver' }}
          REACT_APP_CHESS_CLIENT_URL: ${{ secrets.CHESS_CLIENT_URL || 'https://ystemandchess.com/chessclient' }}
          REACT_APP_AGORA_APP_ID: ${{ secrets.APP_ID || '' }}

      - name: Test react-ystemandchess
        run: npm test
        working-directory: ./react-ystemandchess

  # Builds every image on pull requests so a Dockerfile regression fails before
  # merge instead of during a deploy. Build-only: nothing is pushed. Shares its
  # per-service layer cache scopes with deploy.yml.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [middlewareNode, chessServer, stockfishServer, chessclient, react-ystemandchess]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
