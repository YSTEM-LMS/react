services:
  mongo:
    image: mongo:6
    container_name: dev-mongo
    ports:
      - "27017:27017"
    volumes:
      - dev-mongo-data:/data/db

  frontend:
    build:
      context: ./react-ystemandchess
      args:
        REACT_APP_AGORA_APP_ID: ""
    container_name: frontend
    # Single origin: open http://localhost:3000. nginx in the image proxies
    # /middleware, /chessserver, /stockfishserver and /chessclient to these.
    environment:
      MIDDLEWARE_UPSTREAM: http://middleware:8000
      CHESS_SERVER_UPSTREAM: http://chess-server:3001
      STOCKFISH_UPSTREAM: http://stockfish-server:8080
      CHESS_CLIENT_UPSTREAM: http://chess-client:80
    ports:
      - "3000:8080"
    depends_on:
      - middleware
      - chess-server
      - stockfish-server
      - chess-client
    restart: unless-stopped

  chess-server:
    build: ./chessServer
    container_name: chess-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MIDDLEWARE_URL=http://middleware:8000
      - CORS_ORIGIN=http://localhost,http://localhost:3000,http://localhost:3002
    restart: unless-stopped

  chess-client:
    build: ./chessclient
    container_name: chess-client
    ports:
      - "3002:80"
    restart: unless-stopped

  middleware:
    build: ./middlewareNode
    container_name: middleware
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - MONGO_URI=mongodb://mongo:27017/ystem_dev
      - INDEX_KEY=dev-index-key-replace-in-prod
      - CORS_ORIGIN=http://localhost,http://localhost:3000
      - SESSION_SECRET=dev-secret-replace-in-prod
      - ANALYTICS_RATE_LIMIT_MAX=100
      - LEADERBOARD_RATE_LIMIT_MAX=60
    depends_on:
      - mongo
    restart: unless-stopped

  stockfish-server:
    build: ./stockfishServer
    container_name: stockfish-server
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - CORS_ORIGIN=http://localhost,http://localhost:3000
    restart: unless-stopped

volumes:
  dev-mongo-data:
